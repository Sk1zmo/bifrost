name: bifrost
description: Bifrost — connect every device on your network.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # dart:ffi helpers for the Rust core
  ffi: ^2.1.0

  # UI
  provider: ^6.1.1
  cupertino_icons: ^1.0.6

  # Platform services
  path_provider: ^2.1.2      # writable directory for config.json
  file_picker: ^6.2.0        # choosing files to send
  open_filex: ^4.4.0         # opening received files
  url_launcher: ^6.2.5       # opening a peer's web dashboard
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
