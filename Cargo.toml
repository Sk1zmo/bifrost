[workspace]
resolver = "2"
members = ["crates/core", "crates/web", "crates/cli"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["Bifrost Contributors"]
repository = "https://github.com/yourorg/bifrost"
rust-version = "1.75"

[workspace.dependencies]
anyhow      = "1"
base64      = "0.22"
chrono      = { version = "0.4", features = ["clock", "serde"] }
dirs        = "5"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex         = "0.4"
if-addrs    = "0.13"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
sha2        = "0.10"
socket2     = { version = "0.5", features = ["all"] }
sysinfo     = "0.30"
thiserror   = "1"
tokio       = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid        = { version = "1", features = ["v4", "serde"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# `panic = "abort"` is deliberately NOT set: it breaks `cargo test --release`
# and prevents the FFI layer from catching panics before they cross into
# Dart/Swift, where unwinding past the boundary is undefined behaviour.
